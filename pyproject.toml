[project]
name = "investigation-engine"
version = "0.1.0"
description = "An evidence-based investigation engine, built in learning-sized slices."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "pypdf>=6.21.2,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
data = [
    "datasets>=4,<6",
]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
