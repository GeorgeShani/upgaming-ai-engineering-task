services:
  - type: web
    name: upgaming-investigation-engine
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /api/live
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: DEMO_ADMIN_TOKEN
        sync: false
      - key: RETRIEVAL_STRATEGY
        value: a
      - key: API_BUDGET_USD
        value: "1.0"
